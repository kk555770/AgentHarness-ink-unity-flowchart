name: Codex Auto-Fix on Failure

on:
  workflow_run:
    # Trigger this job after any run of the primary CI workflow completes
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  auto-fix:
    # Only run when the referenced workflow concluded with a failure
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      FAILED_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
      FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
      FAILED_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      FAILED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check prerequisites
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is not set. Skipping auto-fix." >&2
            exit 1
          fi
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "UNITY_AUTH_MODE=personal" >> "$GITHUB_ENV"
          elif [ -n "$UNITY_SERIAL" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "UNITY_AUTH_MODE=professional" >> "$GITHUB_ENV"
          else
            echo "::error::[OpsidanosInk] 缺少完整的 Unity 驗證 secrets，這次 CI 失敗不是 auto-fix 可以假裝修好的問題。"
            echo "[OpsidanosInk] Personal license：UNITY_LICENSE + UNITY_EMAIL + UNITY_PASSWORD"
            echo "[OpsidanosInk] Professional license：UNITY_SERIAL + UNITY_EMAIL + UNITY_PASSWORD"
            exit 1
          fi

      - name: Checkout failing ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FAILED_HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 抓失敗 run 的 test / evidence artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 Tools/fetch_ci_test_results.py --workflow-file CI.yml --run-id "$FAILED_RUN_ID" --output-dir Artifacts/CI/TestResults

      - name: 生成失敗 run 的 test results index
        run: python3 Tools/generate_test_results_index.py --results-root Artifacts/CI/TestResults --output-path Artifacts/CI/TestResults/failing_test_results_index.md

      - name: Prepare Codex prerequisites
        shell: bash
        run: |
          # Ensure python3 exists for Codex' login helper
          if ! command -v python3 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y python3
          fi
          mkdir -p "$HOME/.codex"
          echo "CODEX_HOME=$HOME/.codex" >> $GITHUB_ENV

      - name: Install Codex CLI
        run: npm i -g @openai/codex

      - name: Authenticate Codex (non-interactive)
        env:
          CODEX_HOME: ${{ env.CODEX_HOME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: codex login --api-key "$OPENAI_API_KEY"

      - name: Run Codex to fix CI failure
        run: |
          codex exec --full-auto --sandbox workspace-write "You are working in a Unity 6000.3.9f1 repository with GitHub Actions. This is not a Node.js monorepo and it does not use Jest as the primary test harness. Read AGENTS.md, Documentation/DocsIndex.md, Documentation/CurrentMilestones.md, Documentation/AgentWorkflowRules.md, .github/workflows/CI.yml, Artifacts/CI/TestResults/_source.json, and Artifacts/CI/TestResults/failing_test_results_index.md first. The standard verification flow is python3 Tools/repo_guard.py, then Unity EditMode and PlayMode test assemblies OpsidanosInk.EditModeTests and OpsidanosInk.PlayModeTests. Identify the minimal change needed to fix the failing CI, implement only that change, and stop. Do not refactor unrelated code or files. Keep changes small and surgical."

      - name: 準備 evidence 目錄
        run: mkdir -p artifacts/evidence/editmode artifacts/evidence/playmode

      - name: Verify repo guards
        run: python3 Tools/repo_guard.py

      - name: Verify EditMode（只跑我們的）
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.9f1
          testMode: editmode
          githubToken: ${{ github.token }}
          artifactsPath: artifacts/editmode
          customParameters: -assemblyNames OpsidanosInk.EditModeTests -logFile artifacts/evidence/editmode/Editor.log

      - name: Verify PlayMode（只跑我們的）
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.9f1
          testMode: playmode
          githubToken: ${{ github.token }}
          artifactsPath: artifacts/playmode
          customParameters: -assemblyNames OpsidanosInk.PlayModeTests -logFile artifacts/evidence/playmode/Editor.log

      - name: Create pull request with fixes
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "fix(ci): auto-fix failing tests via Codex"
          branch: codex/auto-fix-${{ github.event.workflow_run.run_id }}
          base: ${{ env.FAILED_HEAD_BRANCH }}
          title: "Auto-fix failing CI via Codex"
          body: |
            Codex automatically generated this PR in response to a CI failure on workflow `${{ env.FAILED_WORKFLOW_NAME }}`.
            Failed run: ${{ env.FAILED_RUN_URL }}
            Head branch: `${{ env.FAILED_HEAD_BRANCH }}`

            This PR contains minimal changes intended solely to make the CI pass.
