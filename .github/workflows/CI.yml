name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-guards:
    name: Repo Guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 跑 repo guard
        run: python3 Tools/repo_guard.py

  ci-gate:
    name: CI 前置檢查
    runs-on: ubuntu-latest
    outputs:
      has-unity-license: ${{ steps.unity-license.outputs.has-unity-license }}
    steps:
      - name: 檢查 UNITY_LICENSE
        id: unity-license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "has-unity-license=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-unity-license=false" >> "$GITHUB_OUTPUT"
          fi

  unity-tests:
    name: Unity 測試（Edit → Play，只跑我們的）
    needs: [repo-guards, ci-gate]
    if: ${{ needs.ci-gate.outputs.has-unity-license == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 跑 EditMode（只跑我們的）
        id: editmode_tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: 6000.3.9f1
          testMode: editmode
          githubToken: ${{ github.token }}
          artifactsPath: artifacts/editmode
          customParameters: -assemblyNames OpsidanosInk.EditModeTests

      - name: 上傳 EditMode 測試結果 artifact
        if: ${{ always() && steps.editmode_tests.outputs.artifactsPath != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results-editmode
          path: ${{ steps.editmode_tests.outputs.artifactsPath }}
          if-no-files-found: error

      - name: 跑 PlayMode（只跑我們的）
        id: playmode_tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: 6000.3.9f1
          testMode: playmode
          githubToken: ${{ github.token }}
          artifactsPath: artifacts/playmode
          customParameters: -assemblyNames OpsidanosInk.PlayModeTests

      - name: 上傳 PlayMode 測試結果 artifact
        if: ${{ always() && steps.playmode_tests.outputs.artifactsPath != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results-playmode
          path: ${{ steps.playmode_tests.outputs.artifactsPath }}
          if-no-files-found: error

  unity-tests-disabled:
    name: Unity 測試（尚未啟用）
    needs: [repo-guards, ci-gate]
    if: ${{ needs.ci-gate.outputs.has-unity-license != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 說明
        run: |
          echo "[OpsidanosInk] 目前未設定 UNITY_LICENSE，所以先不在 GitHub Actions 跑 Unity 測試。"
          echo "[OpsidanosInk] 你可以到 GitHub Repo → Settings → Secrets and variables → Actions → New repository secret"
          echo "[OpsidanosInk] 新增一個名為 UNITY_LICENSE 的 secret，之後這個 CI 就會自動跑測試。"
